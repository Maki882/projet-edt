<svg xmlns="http://www.w3.org/2000/svg" width="1506" height="524" viewBox="0 0 1506 524" font-family="Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1506" height="524" fill="#ffffff"/>
<rect x="24" y="30" width="262" height="44" rx="6" fill="#1f3f66" stroke="#2f4b6e"/>
<text x="155.0" y="58.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">1. Accueil</text>
<rect x="24" y="82" width="262" height="262" rx="6" fill="#f4f7fb" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="38.0" y="110.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Savoir où en est le semestre</text>
<circle cx="42" cy="137" r="2.6" fill="#2f4b6e"/>
<text x="52.0" y="142.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Lire « Prochaine étape » :</text>
<text x="52.0" y="164.0" font-size="13.5" text-anchor="start" fill="#1b1f24">l&#x27;action utile du moment</text>
<circle cx="42" cy="181" r="2.6" fill="#2f4b6e"/>
<text x="52.0" y="186.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Voir la version active</text>
<circle cx="42" cy="203" r="2.6" fill="#2f4b6e"/>
<text x="52.0" y="208.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Voir s&#x27;il reste des points</text>
<text x="52.0" y="230.0" font-size="13.5" text-anchor="start" fill="#1b1f24">à traiter</text>
<polyline points="290.0,213.0 320.0,213.0" fill="none" stroke="#2f4b6e" stroke-width="2.2"/>
<polygon points="324.0,213.0 313.0,218.5 313.0,207.5" fill="#2f4b6e"/>
<rect x="326" y="30" width="262" height="44" rx="6" fill="#1f3f66" stroke="#2f4b6e"/>
<text x="457.0" y="58.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">2. Données</text>
<rect x="326" y="82" width="262" height="262" rx="6" fill="#f4f7fb" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="340.0" y="110.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Décrire l&#x27;établissement</text>
<circle cx="344" cy="137" r="2.6" fill="#2f4b6e"/>
<text x="354.0" y="142.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Établissement : campus, salles,</text>
<text x="354.0" y="164.0" font-size="13.5" text-anchor="start" fill="#1b1f24">enseignants, groupes, matières</text>
<circle cx="344" cy="181" r="2.6" fill="#2f4b6e"/>
<text x="354.0" y="186.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Besoins et indisponibilités</text>
<circle cx="344" cy="203" r="2.6" fill="#2f4b6e"/>
<text x="354.0" y="208.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Règles et calendrier : jours</text>
<text x="354.0" y="230.0" font-size="13.5" text-anchor="start" fill="#1b1f24">fermés, grille, règles</text>
<text x="354.0" y="252.0" font-size="13.5" text-anchor="start" fill="#1b1f24">personnalisées, paramètres</text>
<circle cx="344" cy="269" r="2.6" fill="#2f4b6e"/>
<text x="354.0" y="274.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Import, export, établissement</text>
<text x="354.0" y="296.0" font-size="13.5" text-anchor="start" fill="#1b1f24">fictif ; listes de référence</text>
<polyline points="592.0,213.0 622.0,213.0" fill="none" stroke="#2f4b6e" stroke-width="2.2"/>
<polygon points="626.0,213.0 615.0,218.5 615.0,207.5" fill="#2f4b6e"/>
<rect x="628" y="30" width="262" height="44" rx="6" fill="#1f3f66" stroke="#2f4b6e"/>
<text x="759.0" y="58.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">3. Générer</text>
<rect x="628" y="82" width="262" height="262" rx="6" fill="#f4f7fb" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="642.0" y="110.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Construire l&#x27;emploi du temps</text>
<circle cx="646" cy="137" r="2.6" fill="#2f4b6e"/>
<text x="656.0" y="142.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Vérifications avant le calcul</text>
<circle cx="646" cy="159" r="2.6" fill="#2f4b6e"/>
<text x="656.0" y="164.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Réglages repliés : règles,</text>
<text x="656.0" y="186.0" font-size="13.5" text-anchor="start" fill="#1b1f24">déjeuner, durée, options</text>
<circle cx="646" cy="203" r="2.6" fill="#2f4b6e"/>
<text x="656.0" y="208.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Lancer, suivre, arrêter</text>
<circle cx="646" cy="225" r="2.6" fill="#2f4b6e"/>
<text x="656.0" y="230.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Résultat et qualité</text>
<circle cx="646" cy="247" r="2.6" fill="#2f4b6e"/>
<text x="656.0" y="252.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Historique et versions</text>
<circle cx="646" cy="269" r="2.6" fill="#2f4b6e"/>
<text x="656.0" y="274.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Points à traiter : anomalies,</text>
<text x="656.0" y="296.0" font-size="13.5" text-anchor="start" fill="#1b1f24">séances à programmer</text>
<polyline points="894.0,213.0 924.0,213.0" fill="none" stroke="#2f4b6e" stroke-width="2.2"/>
<polygon points="928.0,213.0 917.0,218.5 917.0,207.5" fill="#2f4b6e"/>
<rect x="930" y="30" width="262" height="44" rx="6" fill="#1f3f66" stroke="#2f4b6e"/>
<text x="1061.0" y="58.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">4. Emploi du temps</text>
<rect x="930" y="82" width="262" height="262" rx="6" fill="#f4f7fb" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="944.0" y="110.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Consulter et retoucher</text>
<circle cx="948" cy="137" r="2.6" fill="#2f4b6e"/>
<text x="958.0" y="142.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Par groupe, enseignant, salle</text>
<circle cx="948" cy="159" r="2.6" fill="#2f4b6e"/>
<text x="958.0" y="164.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Semaine type, semaine datée,</text>
<text x="958.0" y="186.0" font-size="13.5" text-anchor="start" fill="#1b1f24">jour</text>
<circle cx="948" cy="203" r="2.6" fill="#2f4b6e"/>
<text x="958.0" y="208.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Ouvrir une séance : déplacer</text>
<text x="958.0" y="230.0" font-size="13.5" text-anchor="start" fill="#1b1f24">(heures possibles indiquées),</text>
<text x="958.0" y="252.0" font-size="13.5" text-anchor="start" fill="#1b1f24">verrouiller, annuler</text>
<circle cx="948" cy="269" r="2.6" fill="#2f4b6e"/>
<text x="958.0" y="274.0" font-size="13.5" text-anchor="start" fill="#1b1f24">Exporter, imprimer</text>
<polyline points="1216.0,30.0 1216.0,344.0" fill="none" stroke="#9aa9bd" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="1242" y="30" width="240" height="44" rx="6" fill="#0b6e69" stroke="#0b6e69"/>
<text x="1362.0" y="58.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="700">5. Tests unitaires</text>
<rect x="1242" y="80" width="240" height="58" rx="6" fill="#ffffff" stroke="#0b6e69" stroke-width="1.4"/>
<text x="1254.0" y="102.0" font-size="13" text-anchor="start" fill="#1b1f24">une partie du logiciel,</text>
<text x="1254.0" y="122.0" font-size="13" text-anchor="start" fill="#1b1f24">isolée du reste</text>
<rect x="1242" y="150" width="240" height="44" rx="6" fill="#8b2f8f" stroke="#8b2f8f"/>
<text x="1362.0" y="178.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="700">6. Tests d&#x27;intégration</text>
<rect x="1242" y="200" width="240" height="58" rx="6" fill="#ffffff" stroke="#8b2f8f" stroke-width="1.4"/>
<text x="1254.0" y="222.0" font-size="13" text-anchor="start" fill="#1b1f24">plusieurs parties ensemble,</text>
<text x="1254.0" y="242.0" font-size="13" text-anchor="start" fill="#1b1f24">dont six parcours complets</text>
<text x="1244.0" y="280.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">Schéma de l&#x27;organisation ;</text>
<text x="1244.0" y="299.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">lancer un test, un fichier, un</text>
<text x="1244.0" y="318.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">composant ou la famille (hors</text>
<text x="1244.0" y="337.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">tests de charge, réservés à la</text>
<text x="1244.0" y="356.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">commande) ; résultat et date de</text>
<text x="1244.0" y="375.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">la dernière exécution</text>
<polyline points="799.0,344.0 799.0,378.0 1061.0,378.0 1061.0,352.0" fill="none" stroke="#2f4b6e" stroke-width="1.8" stroke-dasharray="6,4"/>
<polygon points="1061.0,346.0 1066.0,356.0 1056.0,356.0" fill="#2f4b6e"/>
<rect x="794.7" y="358.0" width="270.6" height="17.0" fill="#ffffff"/>
<text x="930.0" y="370.0" font-size="13" text-anchor="middle" fill="#1b1f24" font-style="italic">voir la séance signalée, la retoucher</text>
<polyline points="719.0,344.0 719.0,414.0 457.0,414.0 457.0,352.0" fill="none" stroke="#2f4b6e" stroke-width="1.8" stroke-dasharray="6,4"/>
<polygon points="457.0,346.0 462.0,356.0 452.0,356.0" fill="#2f4b6e"/>
<rect x="384.8" y="422.0" width="406.4" height="17.0" fill="#ffffff"/>
<text x="588.0" y="434.0" font-size="13" text-anchor="middle" fill="#1b1f24" font-style="italic">corriger une donnée ou une règle, puis générer à nouveau</text>
<rect x="24" y="454" width="1458" height="52" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="40.0" y="476.0" font-size="13.5" text-anchor="start" fill="#1b1f24" font-weight="700">Assistant (bouton présent sur chaque page) :</text>
<text x="40.0" y="496.0" font-size="13.5" text-anchor="start" fill="#1b1f24">répond en langage courant sur les données et l&#x27;emploi du temps ; propose une règle ou une indisponibilité, enregistrée seulement après un clic sur « Confirmer ».</text>
</svg>
