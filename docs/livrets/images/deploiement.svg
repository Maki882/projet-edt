<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="640" fill="#ffffff"/>
<rect x="20" y="40" width="250" height="110" rx="6" fill="#f4f7fb" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="32.0" y="62.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Poste de l&#x27;utilisateur</text>
<text x="32.0" y="82.0" font-size="12.5" text-anchor="start" fill="#1b1f24">ordinateur ou téléphone</text>
<text x="32.0" y="99.0" font-size="12.5" text-anchor="start" fill="#1b1f24">navigateur web récent</text>
<text x="32.0" y="116.0" font-size="12.5" text-anchor="start" fill="#1b1f24">(aucune installation)</text>
<rect x="20" y="330" width="250" height="150" rx="6" fill="#f4f7fb" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="32.0" y="352.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Poste de développement</text>
<text x="32.0" y="372.0" font-size="12.5" text-anchor="start" fill="#1b1f24">Windows 11, Python 3.11,</text>
<text x="32.0" y="389.0" font-size="12.5" text-anchor="start" fill="#1b1f24">environnement virtuel (venv)</text>
<text x="32.0" y="406.0" font-size="12.5" text-anchor="start" fill="#1b1f24">pytest, ruff, git, gh</text>
<text x="32.0" y="423.0" font-size="12.5" text-anchor="start" fill="#1b1f24">script deploy/deployer.sh</text>
<text x="32.0" y="440.0" font-size="12.5" text-anchor="start" fill="#1b1f24">(connexion SSH par clé)</text>
<rect x="20" y="520" width="250" height="100" rx="6" fill="#f4f7fb" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="32.0" y="542.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">GitHub</text>
<text x="32.0" y="562.0" font-size="12.5" text-anchor="start" fill="#1b1f24">dépôt du code, pull requests</text>
<text x="32.0" y="579.0" font-size="12.5" text-anchor="start" fill="#1b1f24">GitHub Actions : ruff et pytest</text>
<text x="32.0" y="596.0" font-size="12.5" text-anchor="start" fill="#1b1f24">sous Python 3.11, 3.13, 3.14</text>
<rect x="340" y="20" width="790" height="600" rx="10" fill="#f7f9fc" stroke="#2f4b6e" stroke-width="1.6"/>
<text x="356.0" y="48.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="700">Serveur : Ubuntu 26.04, 2 cœurs, 3,7 Go de mémoire, Python 3.14</text>
<rect x="360" y="70" width="360" height="150" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="372.0" y="92.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">nginx (ports 80 et 443)</text>
<text x="372.0" y="112.0" font-size="12.5" text-anchor="start" fill="#1b1f24">HTTPS : certificat Let&#x27;s Encrypt (certbot)</text>
<text x="372.0" y="129.0" font-size="12.5" text-anchor="start" fill="#1b1f24">redirige le port 80 vers HTTPS</text>
<text x="372.0" y="146.0" font-size="12.5" text-anchor="start" fill="#1b1f24">sert les fichiers statiques</text>
<text x="372.0" y="163.0" font-size="12.5" text-anchor="start" fill="#1b1f24">relaie le reste vers 127.0.0.1:8000</text>
<text x="372.0" y="180.0" font-size="12.5" text-anchor="start" fill="#1b1f24">pages d&#x27;erreur 502 et 413 (envoi &gt; 21 Mo)</text>
<rect x="750" y="70" width="360" height="150" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="762.0" y="92.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Service systemd « edt »</text>
<text x="762.0" y="112.0" font-size="12.5" text-anchor="start" fill="#1b1f24">uvicorn edt.web.asgi:app</text>
<text x="762.0" y="129.0" font-size="12.5" text-anchor="start" fill="#1b1f24">un seul processus, 127.0.0.1:8000</text>
<text x="762.0" y="146.0" font-size="12.5" text-anchor="start" fill="#1b1f24">utilisateur système edt, sans shell</text>
<text x="762.0" y="163.0" font-size="12.5" text-anchor="start" fill="#1b1f24">réglages : /etc/edt/edt.env</text>
<text x="762.0" y="180.0" font-size="12.5" text-anchor="start" fill="#1b1f24">redémarre seul après une panne</text>
<rect x="360" y="260" width="360" height="130" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="372.0" y="282.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Versions déployées</text>
<text x="372.0" y="302.0" font-size="12.5" text-anchor="start" fill="#1b1f24">/opt/edt/versions/&lt;date&gt;-&lt;commit&gt;</text>
<text x="372.0" y="319.0" font-size="12.5" text-anchor="start" fill="#1b1f24">chacune avec son code et son venv</text>
<text x="372.0" y="336.0" font-size="12.5" text-anchor="start" fill="#1b1f24">/opt/edt/courant : lien vers la version</text>
<text x="372.0" y="353.0" font-size="12.5" text-anchor="start" fill="#1b1f24">en service (retour arrière possible)</text>
<rect x="750" y="260" width="360" height="130" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="762.0" y="282.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Base et journaux</text>
<text x="762.0" y="302.0" font-size="12.5" text-anchor="start" fill="#1b1f24">base SQLite : /var/lib/edt/edt.db</text>
<text x="762.0" y="319.0" font-size="12.5" text-anchor="start" fill="#1b1f24">journaux : journald et /var/log/edt</text>
<text x="762.0" y="336.0" font-size="12.5" text-anchor="start" fill="#1b1f24">(un fichier par calcul)</text>
<text x="762.0" y="353.0" font-size="12.5" text-anchor="start" fill="#1b1f24">commandes : sudo edt &lt;commande&gt;</text>
<rect x="360" y="430" width="360" height="110" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="372.0" y="452.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Sauvegarde quotidienne</text>
<text x="372.0" y="472.0" font-size="12.5" text-anchor="start" fill="#1b1f24">minuteur edt-sauvegarde.timer (3 h 30)</text>
<text x="372.0" y="489.0" font-size="12.5" text-anchor="start" fill="#1b1f24">copie vérifiée de la base, 14 gardées,</text>
<text x="372.0" y="506.0" font-size="12.5" text-anchor="start" fill="#1b1f24">plus une avant chaque déploiement</text>
<rect x="750" y="430" width="360" height="110" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="762.0" y="452.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Assistant (optionnel, en cours)</text>
<text x="762.0" y="472.0" font-size="12.5" text-anchor="start" fill="#1b1f24">appel sortant en HTTPS vers l&#x27;API</text>
<text x="762.0" y="489.0" font-size="12.5" text-anchor="start" fill="#1b1f24">Claude d&#x27;Anthropic ; clé fournie par</text>
<text x="762.0" y="506.0" font-size="12.5" text-anchor="start" fill="#1b1f24">l&#x27;environnement du serveur, hors dépôt</text>
<rect x="1170" y="410" width="210" height="110" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="1182.0" y="432.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">API Claude</text>
<text x="1182.0" y="452.0" font-size="12.5" text-anchor="start" fill="#1b1f24">service externe</text>
<text x="1182.0" y="469.0" font-size="12.5" text-anchor="start" fill="#1b1f24">(Anthropic)</text>
<text x="1182.0" y="486.0" font-size="12.5" text-anchor="start" fill="#1b1f24">optionnel</text>
<polyline points="270.0,95.0 352.0,95.0" fill="none" stroke="#2f4b6e" stroke-width="1.8"/>
<polygon points="360.0,95.0 350.0,100.0 350.0,90.0" fill="#2f4b6e"/>
<rect x="265.7" y="76.0" width="78.6" height="16.0" fill="#ffffff"/>
<text x="305.0" y="87.0" font-size="12" text-anchor="middle" fill="#1b1f24" font-style="italic">HTTPS (443)</text>
<polyline points="720.0,145.0 742.0,145.0" fill="none" stroke="#2f4b6e" stroke-width="1.8"/>
<polygon points="750.0,145.0 740.0,150.0 740.0,140.0" fill="#2f4b6e"/>
<polyline points="930.0,220.0 930.0,252.0" fill="none" stroke="#2f4b6e" stroke-width="1.8"/>
<polygon points="930.0,260.0 925.0,250.0 935.0,250.0" fill="#2f4b6e"/>
<rect x="937.4" y="234.0" width="85.2" height="16.0" fill="#ffffff"/>
<text x="980.0" y="245.0" font-size="12" text-anchor="middle" fill="#1b1f24" font-style="italic">lit et écrit</text>
<polyline points="790.0,390.0 790.0,408.0 540.0,408.0 540.0,422.0" fill="none" stroke="#2f4b6e" stroke-width="1.8"/>
<polygon points="540.0,430.0 535.0,420.0 545.0,420.0" fill="#2f4b6e"/>
<rect x="645.5" y="393.0" width="39.0" height="16.0" fill="#ffffff"/>
<text x="665.0" y="404.0" font-size="12" text-anchor="middle" fill="#1b1f24" font-style="italic">copie</text>
<polyline points="270.0,405.0 355.1,296.3" fill="none" stroke="#2f4b6e" stroke-width="1.8"/>
<polygon points="360.0,290.0 357.8,301.0 349.9,294.8" fill="#2f4b6e"/>
<rect x="239.3" y="319.0" width="131.4" height="16.0" fill="#ffffff"/>
<text x="305.0" y="330.0" font-size="12" text-anchor="middle" fill="#1b1f24" font-style="italic">envoi d&#x27;une version</text>
<polyline points="145.0,480.0 145.0,512.0" fill="none" stroke="#2f4b6e" stroke-width="1.8"/>
<polygon points="145.0,520.0 140.0,510.0 150.0,510.0" fill="#2f4b6e"/>
<rect x="142.4" y="494.0" width="85.2" height="16.0" fill="#ffffff"/>
<text x="185.0" y="505.0" font-size="12" text-anchor="middle" fill="#1b1f24" font-style="italic">git push, PR</text>
<polyline points="1110.0,485.0 1162.0,485.0" fill="none" stroke="#2f4b6e" stroke-width="1.8" stroke-dasharray="6,4"/>
<polygon points="1170.0,485.0 1160.0,490.0 1160.0,480.0" fill="#2f4b6e"/>
<rect x="1120.5" y="464.0" width="39.0" height="16.0" fill="#ffffff"/>
<text x="1140.0" y="475.0" font-size="12" text-anchor="middle" fill="#1b1f24" font-style="italic">HTTPS</text>
</svg>
