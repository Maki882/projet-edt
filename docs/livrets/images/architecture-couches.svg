<polyline points="1210.0,450.0 1210.0,502.0" fill="none" stroke="#2f4b6e" stroke-width="2"/>
<polygon points="1210.0,510.0 1205.0,500.0 1215.0,500.0" fill="#2f4b6e"/>
<text x="234.0" y="464.0" font-size="12" text-anchor="start" fill="#1b1f24" font-style="italic">logique pure : reçoit des services une copie figée des données du semestre</text>
<text x="20.0" y="650.0" font-size="13" text-anchor="start" fill="#1b1f24">Une couche n&#x27;appelle que les couches du dessous. Toutes les couches écrivent dans les journaux.</text>
