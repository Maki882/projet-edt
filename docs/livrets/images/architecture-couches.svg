<polygon points="1170.0,325.0 1165.0,315.0 1175.0,315.0" fill="#2f4b6e"/>
<polyline points="1345.0,270.0 1345.0,502.0" fill="none" stroke="#2f4b6e" stroke-width="2"/>
<polygon points="1345.0,510.0 1340.0,500.0 1350.0,500.0" fill="#2f4b6e"/>
<polyline points="990.0,450.0 990.0,502.0" fill="none" stroke="#2f4b6e" stroke-width="2"/>
