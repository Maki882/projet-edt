<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="668" viewBox="0 0 1400 668" font-family="Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="668" fill="#ffffff"/>
<rect x="20" y="20" width="1360" height="130" rx="8" fill="#f7f9fc" stroke="#2f4b6e" stroke-width="1.0"/>
<text x="36.0" y="50.0" font-size="16" text-anchor="start" fill="#1b1f24" font-weight="700">Interfaces</text>
<text x="36.0" y="72.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">ce que l&#x27;utilisateur</text>
<text x="36.0" y="90.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">manipule</text>
<rect x="230" y="35" width="360" height="100" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="410.0" y="57.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Interface web</text>
<text x="410.0" y="77.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">FastAPI, gabarits Jinja2, HTMX</text>
<text x="410.0" y="94.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">cinq onglets, formulaires, pages d&#x27;erreur</text>
<text x="410.0" y="111.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">lisibles</text>
<rect x="615" y="35" width="340" height="100" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="785.0" y="57.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Ligne de commande</text>
<text x="785.0" y="77.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">Typer : python -m edt &lt;commande&gt;</text>
<text x="785.0" y="94.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">17 commandes (installation, calcul,</text>
<text x="785.0" y="111.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">import, export, sauvegarde...)</text>
<rect x="980" y="35" width="390" height="100" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="1175.0" y="57.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Assistant (optionnel, en cours)</text>
<text x="1175.0" y="77.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">panneau de chaque page ; bibliothèque</text>
<text x="1175.0" y="94.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">anthropic vers l&#x27;API Claude ; il n&#x27;agit</text>
<text x="1175.0" y="111.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">que par les services, après confirmation</text>
<rect x="20" y="175" width="1360" height="110" rx="8" fill="#f7f9fc" stroke="#2f4b6e" stroke-width="1.0"/>
<text x="36.0" y="205.0" font-size="16" text-anchor="start" fill="#1b1f24" font-weight="700">Services</text>
<text x="36.0" y="227.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">fonctions typées,</text>
<text x="36.0" y="245.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">le seul point d&#x27;entrée</text>
<rect x="230" y="190" width="1140" height="80" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="800.0" y="212.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Services (une fonction par fonctionnalité, paramètres et résultats explicites)</text>
<text x="800.0" y="232.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">référentiels, besoins, règles personnalisées, paramètres, calendrier, génération et suivi des calculs,</text>
<text x="800.0" y="249.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">emploi du temps (consultation, retouche, séances datées), vérification, échange de fichiers, établissements fictifs</text>
<rect x="20" y="310" width="1360" height="160" rx="8" fill="#f7f9fc" stroke="#2f4b6e" stroke-width="1.0"/>
<text x="36.0" y="340.0" font-size="16" text-anchor="start" fill="#1b1f24" font-weight="700">Logique</text>
<text x="36.0" y="362.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">les trois premières</text>
<text x="36.0" y="380.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">parties n&#x27;accèdent</text>
<text x="36.0" y="398.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">ni à la base ni</text>
<text x="36.0" y="416.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">au réseau</text>
<rect x="230" y="325" width="200" height="125" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="330.0" y="347.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Domaine</text>
<text x="330.0" y="367.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">instantané figé du</text>
<text x="330.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">semestre, catalogue</text>
<text x="330.0" y="401.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">des règles, calendrier</text>
<rect x="450" y="325" width="200" height="125" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="550.0" y="347.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Générateur</text>
<text x="550.0" y="367.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">OR-Tools CP-SAT :</text>
<text x="550.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">horaires puis salles,</text>
<text x="550.0" y="401.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">séances datées</text>
<rect x="670" y="325" width="200" height="125" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="770.0" y="347.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Vérificateur</text>
<text x="770.0" y="367.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">liste les anomalies,</text>
<text x="770.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">indépendant du</text>
<text x="770.0" y="401.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">générateur</text>
<rect x="890" y="325" width="200" height="125" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="990.0" y="347.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Échange de fichiers</text>
<text x="990.0" y="367.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">openpyxl (XLSX),</text>
<text x="990.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">CSV, icalendar</text>
<text x="990.0" y="401.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">et python-dateutil</text>
<rect x="1110" y="325" width="200" height="125" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="1210.0" y="347.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Établissements fictifs</text>
<text x="1210.0" y="367.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">numéro de variante,</text>
<text x="1210.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">noms français</text>
<text x="1210.0" y="401.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">(Faker)</text>
<rect x="20" y="495" width="1360" height="120" rx="8" fill="#f7f9fc" stroke="#2f4b6e" stroke-width="1.0"/>
<text x="36.0" y="525.0" font-size="16" text-anchor="start" fill="#1b1f24" font-weight="700">Stockage</text>
<text x="36.0" y="547.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">un fichier de base,</text>
<text x="36.0" y="565.0" font-size="12.5" text-anchor="start" fill="#1b1f24" font-style="italic">des journaux</text>
<rect x="810" y="510" width="560" height="90" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="1090.0" y="532.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Base de données</text>
<text x="1090.0" y="552.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">SQLAlchemy 2 (modèles, transactions) sur SQLite,</text>
<text x="1090.0" y="569.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">mode WAL, clés étrangères actives, 22 classes / 29 tables</text>
<rect x="230" y="510" width="560" height="90" rx="6" fill="#ffffff" stroke="#2f4b6e" stroke-width="1.4"/>
<text x="510.0" y="532.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700">Journaux</text>
<text x="510.0" y="552.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">module logging : console et fichier tournant,</text>
<text x="510.0" y="569.0" font-size="12.5" text-anchor="middle" fill="#1b1f24">un fichier par calcul ; identifiant de requête repris sur les pages d&#x27;erreur</text>
