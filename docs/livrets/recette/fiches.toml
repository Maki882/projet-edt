# Fiches de recette du livret 4 (docs/livrets/4-cahier-de-recette.md).
#
# Source unique, écrite à la main. L'outil `python -m tests.outils.recette --ecrire` en tire la
# section 4 (fiches), la matrice de traçabilité et les nombres du livret ; le contrôle
# `tests/unitaires/socle/test_recette.py` vérifie que chaque test cité existe dans
# tests/integration/ et que chaque fonctionnalité réalisée du livret 1 a une fiche.
#
# Une fiche :
#   id              REC-BOUT-n (parcours), REC-O5-n, REC-U3-n, REC-P2-n (fonctionnalité),
#                   REC-EXP-n (exploitation et robustesse)
#   titre, objectif, depart (conditions de départ) : texte
#   fonctionnalites : codes du livret 1 (O1 à O11, U1 à U13, P1 à P10)
#   cas             : numéros des cas d'usage du livret 1 qu'elle illustre (facultatif)
#   etapes, attendu : listes de phrases ; un résultat attendu est vérifié par les tests cités
#   tests           : identifiants pytest des tests d'intégration qui la prouvent
#   remarque        : facultative (substitut employé, limite de la preuve)
#   [fiche.essai]   : essai manuel, pour ce qu'aucun test par HTTP ne peut vérifier :
#                     date, environnement, constat, verdict (« Conforme » ou « Non conforme »),
#                     reserve (facultative), preuves = [{ image = "images/…", legende = "…" }]
#
# [[sans_fiche]] : fonctionnalité réalisée sans fiche, avec sa raison (affichée dans les
# réserves du livret). Aucune à cette passe.
#
# Les libellés « entre guillemets » sont ceux des écrans ou des messages de l'application.

# =========================================================================================
# Parcours de bout en bout
# =========================================================================================

[[fiche]]
id = "REC-BOUT-1"
titre = "Parcours sur le site : générer l'emploi du temps du semestre, le consulter et l'exporter"
fonctionnalites = ["O5", "O4", "U7", "O7", "O10", "U12"]
cas = [1, 6]
objectif = "Montrer que, depuis le site, un calcul lancé sur le semestre produit une version active, affichée dans la grille, sans anomalie bloquante, et que les exports CSV et iCal contiennent exactement les séances enregistrées."
depart = "Base neuve chargée du jeu minimal (2 campus, 6 salles, 5 enseignants, 9 groupes, 6 matières, 16 besoins, semestre 1 de 2026-2027) ; option « Emploi du temps plus confortable » coupée ; aucun emploi du temps calculé. Vrai moteur de calcul, vrai vérificateur."
etapes = [
  "Onglet « Générer », semestre 1 : cliquer sur « Lancer le calcul » sans changer les réglages, puis attendre la fin du calcul.",
  "Ouvrir « Historique et versions », puis l'emploi du temps de la version produite.",
  "Faire vérifier la semaine type et les séances datées de la version.",
  "Dans « Données › Export », section « Emploi du temps », télécharger la version en CSV puis en iCal.",
]
attendu = [
  "L'envoi du formulaire redirige vers la page du calcul ; le calcul se termine avec succès en moins de 20 secondes.",
  "L'historique montre une version portant l'étiquette « Active » ; la grille de la version contient des séances.",
  "Le vérificateur ne relève aucune anomalie bloquante, ni dans la semaine type, ni dans les séances datées.",
  "Le fichier CSV a exactement une ligne par séance de la version ; le fichier iCal, exactement autant d'événements.",
]
tests = [
  "tests/integration/parcours/test_parcours_web.py::test_parcours_web_du_calcul_a_l_export",
]
remarque = "Le test ne contrôle jamais où le moteur place une séance, seulement des propriétés (version active, aucune anomalie bloquante, nombres égaux)."

