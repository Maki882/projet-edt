{#- Nombre d'éléments à traiter, pour l'onglet du menu. Variables : total, complet. -#}
{%- if total -%}
<span class="edt-compteur-onglet" title="{{ total }} point{{ "s" if total > 1 }} à traiter{% if not complet %} (vérifications automatiques incomplètes){% endif %}">{{ total }}</span>
{%- endif -%}
