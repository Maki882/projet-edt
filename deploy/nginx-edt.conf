# =============================================================================
# deploy/nginx-edt.conf — site nginx de l'application EDT, MODE HTTP.
#
# Utilisé tant qu'aucun certificat n'existe pour le nom de domaine. Installé
# par installer-serveur.sh dans /etc/nginx/sites-available/edt, après
# remplacement de @EDT_DOMAINE@ par le nom de domaine (paramètre EDT_DOMAINE,
# deploy/serveur.env). Dès qu'un certificat existe (activer-https.sh),
# c'est nginx-edt-https.conf qui est installé à la place.
#
# Journaux : /var/log/nginx/edt-acces.log et /var/log/nginx/edt-erreurs.log.
# =============================================================================

# Format du journal d'accès : durée totale, durée côté application et
# identifiant attribué par l'application (en-tête X-Request-ID, aussi présent
# dans edt.log et sur les pages d'erreur).
log_format edt_journal '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'duree=$request_time duree_appli=$upstream_response_time id=$upstream_http_x_request_id';

server {
    # Serveur par défaut : répond au nom de domaine ET à l'adresse IP.
    listen 80 default_server;
    server_name @EDT_DOMAINE@ _;

    access_log /var/log/nginx/edt-acces.log edt_journal;
    error_log  /var/log/nginx/edt-erreurs.log warn;

    # Défis Let's Encrypt (obtention puis renouvellement du certificat).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # L'application (proxy vers uvicorn, statiques, page 502).
    include /etc/nginx/snippets/edt-application.conf;
}
