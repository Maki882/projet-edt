# =============================================================================
# deploy/nginx-edt-https.conf — site nginx de l'application EDT, MODE HTTPS.
#
# Installé (au lieu de nginx-edt.conf) dans /etc/nginx/sites-available/edt par
# installer-serveur.sh dès qu'un certificat Let's Encrypt existe pour le nom de
# domaine, après remplacement de @EDT_DOMAINE@. activer-https.sh l'installe
# juste après avoir obtenu le certificat.
#
# Journaux : /var/log/nginx/edt-acces.log et /var/log/nginx/edt-erreurs.log.
# =============================================================================

log_format edt_journal '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'duree=$request_time duree_appli=$upstream_response_time id=$request_id';

# Port 80, serveur par défaut (nom de domaine ET adresse IP) : tout est
# redirigé vers https://@EDT_DOMAINE@, sauf les défis Let's Encrypt
# (renouvellement du certificat).
server {
    listen 80 default_server;
    server_name @EDT_DOMAINE@ _;
    server_tokens off;

    access_log /var/log/nginx/edt-acces.log edt_journal;
    error_log  /var/log/nginx/edt-erreurs.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://@EDT_DOMAINE@$request_uri;
    }
}

# Port 443 : l'application en HTTPS.
server {
    listen 443 ssl default_server;
    server_name @EDT_DOMAINE@;

    access_log /var/log/nginx/edt-acces.log edt_journal;
    error_log  /var/log/nginx/edt-erreurs.log warn;

    # Certificat obtenu et renouvelé par certbot (activer-https.sh).
    ssl_certificate     /etc/letsencrypt/live/@EDT_DOMAINE@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@EDT_DOMAINE@/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:edt_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # L'application (proxy vers uvicorn, statiques, page 502).
    include /etc/nginx/snippets/edt-application.conf;
}
