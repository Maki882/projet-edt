# =============================================================================
# deploy/nginx-edt-application.conf — comment nginx sert l'application EDT.
#
# Partie commune aux deux modes du site : incluse dans le bloc « server » qui
# sert l'application (port 80 en mode HTTP, port 443 en mode HTTPS).
# Installée par installer-serveur.sh dans /etc/nginx/snippets/edt-application.conf.
# =============================================================================

server_tokens off;

# Import de classeurs : jusqu'à 20 Mo par envoi.
client_max_body_size 20m;

# En-têtes transmis à l'application (uvicorn --proxy-headers lit X-Forwarded-*).
# X-Request-ID : même identifiant dans le journal d'accès nginx (id=...) et,
# si l'application le reprend, dans ses propres journaux.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Connection        "";

# Délais : connexion courte (application arrêtée = page 502 tout de suite) ;
# envoi et lecture généreux (import de gros fichiers, pages lourdes). Le calcul
# d'un emploi du temps tourne en arrière-plan : aucune requête ne l'attend.
proxy_connect_timeout 5s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Application arrêtée ou injoignable : page explicative en français, avec le
# code 502 d'origine.
error_page 502 503 504 /erreur-502.html;
location = /erreur-502.html {
    internal;
    root /var/www/edt-erreurs;
    charset utf-8;
    add_header Cache-Control "no-store" always;
}

# Fichiers statiques : servis directement par nginx depuis la version en
# service s'ils existent dans src/edt/web/static/ ; sinon (fichier absent ou
# autre emplacement choisi par l'application) la requête passe à l'application.
location /static/ {
    root /opt/edt/courant/code/src/edt/web;
    try_files $uri @application;
    # Le navigateur revalide à chaque fois : pas de fichier périmé après un déploiement.
    expires -1;
}

location / {
    proxy_pass http://127.0.0.1:8000;
}

location @application {
    proxy_pass http://127.0.0.1:8000;
}
