name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint et tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            contraintes.txt

      - name: Installer le projet et ses outils
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c contraintes.txt

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format (ruff format --check)
        run: python -m ruff format --check .

      # Les tests de charge (marqueur perf) sont exclus de la CI courante.
      - name: Contrôle du rangement des tests
        run: python -m pytest tests/test_rangement.py

      - name: Tests unitaires
        run: python -m pytest tests/unitaires -m "not perf"

      - name: Tests d'intégration
        run: python -m pytest tests/integration -m "not perf"
